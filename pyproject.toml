[project]
name = "fastapi-industrie-ultra"
version = "1.0.0"
description = "API FastAPI industrielle avec SQLAlchemy async, Alembic, tests, Docker et CI/CD"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Votre Nom", email = "votre.email@company.com"}
]
keywords = ["fastapi", "sqlalchemy", "async", "production"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "SQLAlchemy>=2.0.30,<2.1.0",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<2.0",
    "python-dotenv>=1.0,<2.0",
    "loguru>=0.7,<0.8",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
    "sentry-sdk[fastapi]>=2.0,<3.0",
    "httpx>=0.27,<0.28",  # pour appels HTTP async
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "black>=24.0,<25.0",
    "ruff>=0.7,<0.8",
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<4.0",
    "pip-audit>=2.7,<3.0",
    "bandit>=1.7,<2.0",  # scan sécurité
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (géré par black)
    "B008",  # function calls in argument defaults
]
fix = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # imports non utilisés OK dans __init__

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"